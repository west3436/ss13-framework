modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"
issueTrackerURL = "https://github.com/west3436/ss13-framework/issues"

[[mods]]
modId = "ss13_framework"
version = "${mod_version}"
displayName = "SS13 Framework"
authors = "west3436"
description = '''
Shared SS13 parts for ZAS³, Expedition and NT Engineering. Each of them nests
this mod, so it never needs to be installed on its own.
'''

[[mixins]]
config = "ss13_framework.mixins.json"

[[dependencies.ss13_framework]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.ss13_framework]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
