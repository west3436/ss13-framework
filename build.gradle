plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    // The framework's own Gradle plugins, built from ss13-gradle-plugin (an included build). They
    // bring Spotless and the Maven publish plugin with them. ZAS³, Expedition and NT Engineering
    // apply the same plugins from Maven Central, at the framework's version.
    id 'io.github.west3436.ss13.conventions' apply false
    id 'io.github.west3436.ss13.api' apply false
    id 'io.github.west3436.ss13.credits'
}

// -Psnapshot=true (or ORG_GRADLE_PROJECT_snapshot=true) builds <version>-SNAPSHOT of the jars and
// the Gradle plugins for the Central snapshots repository. CI does this after every green build on
// main.
def snapshot = providers.gradleProperty('snapshot').getOrElse('false').toBoolean()

subprojects {
    // Java 21, Spotless, NeoForge and Parchment from gradle.properties, and Central publishing for a
    // project that applies com.vanniktech.maven.publish.
    apply plugin: 'io.github.west3436.ss13.conventions'
    ss13 { githubRepo = 'west3436/ss13-framework' }

    group = 'io.github.west3436'
    version = snapshot ? "${mod_version}-SNAPSHOT" : mod_version
    ext.snapshot = snapshot

    // The versions that a nested copy accepts: from this one up to the next version that may break
    // it. That is the next minor while a jar is 0.x, and the next major from 1.0. A snapshot's floor
    // is the snapshot itself, since 0.1.0-SNAPSHOT sorts below 0.1.0 and FML would otherwise
    // refuse the copy that is nested.
    ext.api_range = ss13.versionRange(api_version, snapshot)
    ext.mod_range = ss13.versionRange(mod_version, snapshot)

    // Expanded into the mod's neoforge.mods.toml.
    tasks.named('processResources', ProcessResources) {
        def props = [
            mod_version      : mod_version,
            api_version      : api_version,
            neo_version      : neo_version,
            minecraft_version: minecraft_version,
        ]
        inputs.properties(props)
        filesMatching('META-INF/neoforge.mods.toml') { expand(props) }
    }
}
