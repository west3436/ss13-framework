// An API jar, such as ss13-framework-api, zas-api or expedition-api: contracts that other mods nest
// (jar-in-jar) and call whether or not the mod that owns them is installed. Apply it with
// ModDevGradle, which brings Minecraft and NeoForge, and name the API's package:
//
//   apply plugin: 'net.neoforged.moddev'
//   apply plugin: 'io.github.west3436.ss13.api'
//   ss13 { apiPackage = 'io.github.west3436.expedition.api' }
//   mavenPublishing { pom { name = 'Expedition API'; description = '...' } }
//
// It applies io.github.west3436.ss13.conventions and com.vanniktech.maven.publish, and:
//
// - Makes the jar a GAMELIBRARY whose Automatic-Module-Name is the API's package, so it loads as its
//   own module in dev and production. No mod lists the API's source set: that would split its
//   package across two modules.
// - checkApiPackages: the jar holds nothing outside the API's package and its subpackages (plus
//   META-INF), so a mod's package and the API's never meet in one jar.
// - checkApiDependencies: the API declares no dependency on another project or any library.
//   Minecraft and NeoForge come from ModDevGradle.
// - javadoc fails on a broken or missing comment, and check runs it, so a bad comment fails the
//   build, not the publish.
// - apiCompat: the binary-compatibility check against the last release, with japicmp.
// - Publishes the jar to Central with its sources and javadoc jars, as group:<project name>.
//
// check runs all four checks.
import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar
import io.github.west3436.ss13.gradle.Ss13Extension

pluginManager.apply('io.github.west3436.ss13.conventions')
pluginManager.apply('com.vanniktech.maven.publish')

def ss13 = Ss13Extension.of(project)

// The project sets its version after it applies this, so the manifest is written once it has.
afterEvaluate {
    if (!ss13.apiPackage.present) {
        throw new GradleException("${project.path}: set ss13.apiPackage to the API's package, such as " +
                "ss13 { apiPackage = 'io.github.west3436.expedition.api' }.")
    }
    tasks.named('jar', Jar) {
        manifest {
            attributes(
                'Automatic-Module-Name': ss13.apiPackage.get(),
                'FMLModType': 'GAMELIBRARY',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
            )
        }
    }
}

def checkApiPackages = tasks.register('checkApiPackages') {
    group = 'verification'
    description = "Fails if the API jar holds a package outside the API's own."
    def jarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }
    def apiPackage = ss13.apiPackage
    inputs.file(jarFile)
    inputs.property('apiPackage', apiPackage)
    doLast {
        def prefix = apiPackage.get().replace('.', '/') + '/'
        def bad = []
        zipTree(jarFile.get().asFile).visit { d ->
            if (d.directory) return
            def path = d.relativePath.pathString
            if (!path.startsWith('META-INF/') && !path.startsWith(prefix)) bad << path
        }
        if (bad) {
            throw new GradleException("The API jar holds files outside ${apiPackage.get()}:\n  " + bad.join('\n  '))
        }
    }
}

def checkApiDependencies = tasks.register('checkApiDependencies') {
    group = 'verification'
    description = 'Fails if the API declares a dependency other than Minecraft and NeoForge.'
    def declared = ['api', 'implementation', 'compileOnly', 'compileOnlyApi', 'runtimeOnly'].collectMany { name ->
        def c = configurations.findByName(name)
        c == null ? [] : c.dependencies.collect { "${name}: ${it.group}:${it.name}" }
    }
    inputs.property('declared', declared)
    doLast {
        if (declared) {
            throw new GradleException('The API may depend only on Minecraft and NeoForge, but declares:\n  ' +
                    declared.join('\n  '))
        }
    }
}

// javadoc leaves doclint's "missing" group out by default and only warns about it, so ask for every
// group and make a warning an error.
tasks.named('javadoc', Javadoc) {
    options.addBooleanOption('Xdoclint:all', true)
    options.addBooleanOption('Werror', true)
}
tasks.named('check') { dependsOn checkApiPackages, checkApiDependencies, tasks.named('javadoc') }

mavenPublishing {
    configure(new JavaLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources()))
}

// apiCompat compares this jar with the released API that api_baseline_version in gradle.properties
// names, using japicmp. A binary-incompatible change needs a new major version, or, while the API is
// 0.x, a new minor version. From 1.0, even a version that may break can't remove what the baseline
// didn't mark @Deprecated. With api_baseline_version empty, as before the first release, it is
// skipped.
//
// The baseline is the jar attached to the project's GitHub release (ss13.githubRepo) tagged
// api_baseline_tag, v<api_baseline_version> if that is empty: an Ivy repository of bare jars, which
// answers for these coordinates and nothing else, and which alone may answer for them. The task
// refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the jar's line in that release's
// SHA256SUMS.txt, since a release's files can be replaced. After a release, set all three.
//
// -Papi_baseline_repo=<url or path> names a Maven repository to find the baseline in instead, for
// testing the check against a local repository. Its jar is whatever was published there, so it has
// no hash to match.
def baselineVersion = providers.gradleProperty('api_baseline_version').getOrElse('').trim()

if (baselineVersion.isEmpty()) {
    def apiCompat = tasks.register('apiCompat') {
        group = 'verification'
        description = 'Checks binary compatibility with the last released API (no baseline set).'
        doLast {
            // On GitHub Actions the ::notice:: prefix turns this into an annotation.
            def prefix = System.getenv('GITHUB_ACTIONS') ? '::notice::' : ''
            logger.lifecycle(prefix + 'apiCompat: skipped, no baseline. Set api_baseline_version in ' +
                    'gradle.properties to the last released API version to enable the check.')
        }
    }
    tasks.named('check') { dependsOn apiCompat }
} else {
    def baselineRepo = providers.gradleProperty('api_baseline_repo').getOrNull()
    def baselineTag = providers.gradleProperty('api_baseline_tag').getOrElse('').trim() ?: "v${baselineVersion}"
    def baselineSha256 = providers.gradleProperty('api_baseline_sha256').getOrElse('').trim().toLowerCase()

    configurations { japicmp }
    dependencies {
        japicmp 'com.github.siom79.japicmp:japicmp:0.26.5:jar-with-dependencies'
    }

    // Breaking changes are allowed only when the version says so: a major bump, or a minor bump
    // while both versions are 0.x.
    def parse = { String v ->
        def m = v =~ /^(\d+)\.(\d+)/
        if (!m.find()) throw new GradleException("apiCompat: not a semver version: ${v}")
        [m.group(1) as int, m.group(2) as int]
    }
    def (oldMajor, oldMinor) = parse(baselineVersion)

    // From 1.0, even a version that may break can't remove what the baseline didn't mark
    // @Deprecated. 0.x promises nothing.
    def deprecationRequired = oldMajor >= 1
    def undeprecatedRemovals = { File xml ->
        // A mark this version adds is no warning to anyone who used the baseline.
        def marked = { node ->
            node.annotations.annotation.any {
                it.@fullyQualifiedName.text() == 'java.lang.Deprecated' && it.@changeStatus.text() != 'NEW'
            }
        }
        def removed = { node -> node.@changeStatus.text() == 'REMOVED' && !marked(node) }
        def found = []
        new groovy.xml.XmlSlurper().parse(xml).classes.'class'.each { c ->
            def name = c.@fullyQualifiedName.text()
            if (removed(c)) {
                found << name
            } else if (!marked(c)) {
                c.fields.field.findAll(removed).each { found << "${name}.${it.@name.text()}" }
                c.methods.method.findAll(removed).each { found << "${name}.${it.@name.text()}()" }
                c.constructors.constructor.findAll(removed).each { found << "${name}, a constructor" }
            }
        }
        found
    }

    def report = layout.buildDirectory.file('reports/apiCompat/apiCompat.html')
    def xmlReport = layout.buildDirectory.file('reports/apiCompat/apiCompat.xml')
    def apiCompat = tasks.register('apiCompat', JavaExec) {
        group = 'verification'
        description = "Checks binary compatibility with the released API ${baselineVersion}."
        classpath = configurations.japicmp
        mainClass = 'japicmp.JApiCmp'
        ignoreExitValue = true
        outputs.file(report)
        outputs.file(xmlReport)
    }
    tasks.named('check') { dependsOn apiCompat }

    // The repository and the baseline's coordinates need the project's group, name and GitHub
    // repository, which it sets after it applies this.
    afterEvaluate {
        def coordinates = "${project.group}:${project.name}"
        repositories {
            exclusiveContent {
                forRepository {
                    if (baselineRepo) {
                        maven {
                            name = 'apiBaseline'
                            url = baselineRepo.contains('://') ? baselineRepo : file(baselineRepo).toURI()
                        }
                    } else {
                        if (!ss13.githubRepo.present) {
                            throw new GradleException("${project.path}: set ss13.githubRepo, whose GitHub " +
                                    'releases hold the API baseline, such as ' +
                                    "ss13 { githubRepo = 'west3436/expedition' }.")
                        }
                        ivy {
                            name = 'apiBaselineRelease'
                            url = "https://github.com/${ss13.githubRepo.get()}/releases/download"
                            patternLayout { artifact "${baselineTag}/[artifact]-[revision].[ext]" }
                            metadataSources { artifact() }
                        }
                    }
                }
                filter { includeModule(project.group.toString(), project.name) }
            }
        }

        // Detached, because a normal configuration of this project resolves its own coordinates
        // to the project itself rather than to the release.
        def apiBaseline = configurations.detachedConfiguration(
                dependencies.create("${coordinates}:${baselineVersion}"))
        apiBaseline.transitive = false

        def current = project.version.toString() - ~/-SNAPSHOT$/
        def (newMajor, newMinor) = parse(current)
        def breakingAllowed = newMajor > oldMajor || (newMajor == 0 && oldMajor == 0 && newMinor > oldMinor)

        tasks.named('apiCompat', JavaExec) {
            def oldJar = apiBaseline
            def newJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
            def libs = configurations.compileClasspath
            inputs.files(oldJar).withPropertyName('baseline')
            inputs.file(newJar).withPropertyName('current')
            inputs.property('baselineSha256', baselineRepo ? '' : baselineSha256)

            doFirst {
                if (!baselineRepo) {
                    def jar = oldJar.singleFile
                    def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes)
                            .encodeHex().toString()
                    if (sha256 != baselineSha256) {
                        throw new GradleException("apiCompat: ${jar.name} from the GitHub release ${baselineTag} " +
                                "has SHA-256 ${sha256}, but api_baseline_sha256 in gradle.properties is " +
                                "${baselineSha256 ?: 'empty'}. It must be that jar's line in the release's " +
                                'SHA256SUMS.txt.')
                    }
                }
                report.get().asFile.parentFile.mkdirs()
                def cp = libs.files.join(File.pathSeparator)
                def a = [
                    '--old', oldJar.singleFile.absolutePath,
                    '--new', newJar.get().asFile.absolutePath,
                    '--old-classpath', cp,
                    '--new-classpath', cp,
                    '--only-modified',
                    '--html-file', report.get().asFile.absolutePath,
                    '--xml-file', xmlReport.get().asFile.absolutePath,
                ]
                if (breakingAllowed) {
                    logger.lifecycle("apiCompat: ${current} may break ${baselineVersion} " +
                            '(new major, or new minor under 0.x); reporting only.')
                } else {
                    a << '--error-on-binary-incompatibility'
                }
                args(a)
            }
            doLast {
                def file = report.get().asFile
                if (executionResult.get().exitValue != 0) {
                    throw new GradleException("apiCompat: ${current} has binary-incompatible changes " +
                            "against ${baselineVersion}. Revert them, or bump the minor version under 0.x " +
                            "(the major from 1.0). Report: ${file}")
                }
                def undeprecated = deprecationRequired ? undeprecatedRemovals(xmlReport.get().asFile) : []
                if (undeprecated) {
                    throw new GradleException("apiCompat: ${current} removes what ${baselineVersion} didn't " +
                            "mark @Deprecated:\n  " + undeprecated.join('\n  ') +
                            "\nDeprecate it in a minor version first, then remove it in a later major. Report: ${file}")
                }
                def how = breakingAllowed ? 'breaking changes allowed by the version bump' : 'binary compatible'
                logger.lifecycle("apiCompat: passed against ${baselineVersion} (${how}). Report: ${file}")
            }
        }
    }
}
