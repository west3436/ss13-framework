apply plugin: 'net.neoforged.moddev'
// An API jar, as zas-api and expedition-api are built: a GAMELIBRARY, published to Central with its
// sources and javadoc, and checked by check: its packages, its dependencies (Minecraft and NeoForge
// only), its javadoc (none broken or missing) and its compatibility with the last release
// (apiCompat). The plugin is in ss13-gradle-plugin.
apply plugin: 'io.github.west3436.ss13.api'

// The framework's contracts, with their own semver. The jar loads as its own GAMELIBRARY module in
// dev and production, so no mod lists this project's source set: listing it would split its
// package across two modules. Mods nest it (jar-in-jar) and call it whether or not the
// ss13_framework mod is installed. It never depends on ZAS³, Expedition or NT Engineering:
// ApiReferencesTest checks that the compiled classes reference nothing else either.
version = ext.snapshot ? "${api_version}-SNAPSHOT" : api_version

ss13 {
    apiPackage = 'io.github.west3436.ss13.api'
}

// Unit tests of the API's pure logic. Minecraft's classes are on the test classpath, but the game
// is never bootstrapped.
neoForge {
    addModdingDependenciesTo(sourceSets.test)
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // ApiReferencesTest scans the compiled API classes.
    def classes = sourceSets.main.output.classesDirs
    inputs.files(classes).withPropertyName('apiClasses')
    systemProperty 'ss13.api.classes', classes.files.join(File.pathSeparator)
}

mavenPublishing {
    pom {
        name = 'SS13 Framework API'
        description = 'The contracts of SS13 Framework, shared SS13 parts for NeoForge mods. ' +
                'Mods may bundle it (jar-in-jar) and call it whether or not the framework mod is installed.'
    }
}
