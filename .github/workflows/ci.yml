name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Asset provenance (CREDITS)
        run: python3 scripts/check_credits.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      # check, inside build, runs the API checks: packages, dependencies,
      # javadoc and binary compatibility (apiCompat).
      - name: Build
        run: ./gradlew build --stacktrace
      # The task can succeed without a server ever starting, so the log must
      # also say that the tests passed.
      - name: GameTests (dedicated server)
        timeout-minutes: 10
        shell: bash
        run: |
          ./gradlew runGameTestServer --stacktrace | tee gametests.log
          passed=$(grep -cE "All [0-9]+ required tests passed" gametests.log || true)
          if [ "$passed" -ne 1 ]; then
            echo "::error::Expected 1 GameTest server to report that its tests passed, but $passed did."
            exit 1
          fi
      # Two built consumers, each nesting the framework, one of them a newer
      # version, on one server with no other copy. One copy must load, the newest.
      - name: One copy of the framework (built jars)
        timeout-minutes: 10
        shell: bash
        run: |
          ./gradlew :example-consumer:runOneCopyGameTestServer --stacktrace | tee one-copy-gametests.log
          passed=$(grep -cE "All [0-9]+ required tests passed" one-copy-gametests.log || true)
          if [ "$passed" -ne 1 ]; then
            echo "::error::Expected the one-copy GameTest server to report that its tests passed, but $passed did."
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: jars
          path: |
            ss13-framework/build/libs/*.jar
            ss13-framework-api/build/libs/*.jar

  # Snapshots of both jars on the Central Portal, after a green build on main.
  # Never on PRs: they don't get the secrets.
  publish-snapshot:
    name: Publish snapshots
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      # Optional: Central doesn't require signed snapshots. The build signs
      # when a key is set.
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check for Central credentials
        id: creds
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CENTRAL_USERNAME or CENTRAL_PASSWORD is not set; skipping the snapshots."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-java@v6
        if: steps.creds.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        if: steps.creds.outputs.present == 'true'
      - name: Publish the snapshots
        if: steps.creds.outputs.present == 'true'
        run: ./gradlew publishToMavenCentral -Psnapshot=true --stacktrace

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
