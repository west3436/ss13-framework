name: CI

# The framework's CI, on the shared workflow that ZAS³, Expedition and NT
# Engineering call too, so every change to it is tried here first.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/shared-build.yml
    with:
      # check, inside build, runs checkCredits (asset provenance), Spotless and
      # the API checks: packages, dependencies, javadoc and binary
      # compatibility (apiCompat).
      #
      # Then the GameTests, and two built consumers, each nesting the
      # framework, one of them a newer version, on one server with no other
      # copy: one copy must load, the newest.
      gametests: |
        1 runGameTestServer
        1 :example-consumer:runOneCopyGameTestServer
      artifact-name: jars
      artifact-path: |
        ss13-framework/build/libs/*.jar
        ss13-framework-api/build/libs/*.jar
      # Snapshots of the jars and the Gradle plugins on the Central Portal,
      # after a green build on main.
      snapshot: "publishToMavenCentral :ss13-gradle-plugin:publishToMavenCentral -Psnapshot=true"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
