name: GameTests (shared)

# One GameTest run on a dedicated server, for the runs a mod keeps out of its
# main CI: the nightly full GameTests, the compatibility matrix, and each row of
# the adapter matrix. A mod's workflow calls it once, or once per row:
#
#   jobs:
#     adapter:
#       name: ${{ matrix.adapter }}
#       strategy:
#         fail-fast: false
#         matrix:
#           include:
#             - adapter: zas (oldest supported)
#               task: ":expedition:runGameTestServer -Pzas.version=floor"
#             - adapter: zas (content off)
#               task: ":expedition:runGameTestServer -Pcontent=off"
#       uses: west3436/ss13-framework/.github/workflows/shared-gametests.yml@v0.2.0
#       with:
#         task: ${{ matrix.task }}
#         # A content-off row means nothing unless the content was off.
#         log-must-contain: ${{ contains(matrix.task, '-Pcontent=off') && 'content is off in zas_atmos-startup.toml' || '' }}
#
# The task can succeed without the server ever starting, so the log must also
# say that the tests passed, once for each server, and hold every line the
# caller asks for.

on:
  workflow_call:
    inputs:
      task:
        description: The Gradle arguments that run the GameTests, such as ":expedition:runGameTestServer -Pcompat.matrix=true".
        type: string
        required: true
      servers:
        description: The number of GameTest servers that must report that their tests passed.
        type: number
        default: 1
      log-must-match:
        description: >-
          Extended regular expressions, one per line, each of which some line of
          the log must match, such as "Enabled Gametest Namespaces: \[expedition\]".
        type: string
        default: ""
      log-must-contain:
        description: Fixed strings, one per line, each of which the log must contain.
        type: string
        default: ""
      timeout-minutes:
        description: The time the run may take.
        type: number
        default: 20
      java-version:
        description: The Java that runs Gradle.
        type: string
        default: "21"

permissions:
  contents: read

jobs:
  gametests:
    name: GameTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
      - name: GameTests
        timeout-minutes: ${{ inputs.timeout-minutes }}
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          SERVERS: ${{ inputs.servers }}
        run: |
          ./gradlew $TASK --stacktrace | tee gametests.log
          passed=$(grep -cE "All [0-9]+ required tests passed" gametests.log || true)
          if [ "$passed" -ne "$SERVERS" ]; then
            echo "::error::Expected $SERVERS GameTest server(s) to report that their tests passed, but $passed did."
            exit 1
          fi
      - name: The log says what it must
        if: inputs.log-must-match != '' || inputs.log-must-contain != ''
        shell: bash
        env:
          MATCH: ${{ inputs.log-must-match }}
          CONTAIN: ${{ inputs.log-must-contain }}
        run: |
          missing=0
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            if ! grep -qE -- "$pattern" gametests.log; then
              echo "::error::No line of the log matches: $pattern"
              missing=1
            fi
          done <<< "$MATCH"
          while IFS= read -r text; do
            [ -n "$text" ] || continue
            if ! grep -qF -- "$text" gametests.log; then
              echo "::error::The log doesn't say: $text"
              missing=1
            fi
          done <<< "$CONTAIN"
          exit $missing
