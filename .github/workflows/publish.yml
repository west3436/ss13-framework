name: Publish to Maven Central

# Releases a released version to Maven Central, signed, with sources and
# javadoc jars: every project that publishes, such as
# io.github.west3436:ss13-framework (the mod, which nests the API) and
# io.github.west3436:ss13-framework-api, and the Gradle plugins
# (io.github.west3436:ss13-gradle-plugin, with a marker for each plugin id).
# Each build is its own deployment. A release on Central can never be changed or
# removed, so nothing starts this but a maintainer, from the Actions tab, naming
# the release's tag. Snapshots are published by CI after every green build on
# main.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

jobs:
  publish:
    uses: ./.github/workflows/shared-publish.yml
    with:
      tag: ${{ inputs.tag }}
      # The plugins are an included build, so they are named on their own.
      publish: "publishAndReleaseToMavenCentral :ss13-gradle-plugin:publishAndReleaseToMavenCentral"
      what: "ss13-framework {mod_version}, ss13-framework-api {api_version} and ss13-gradle-plugin {mod_version}"
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
