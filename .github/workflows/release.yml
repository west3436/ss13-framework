name: Release

# A tag v<mod_version> on a commit on main builds the jars and attaches them to
# a draft GitHub release, which a maintainer reads and then publishes. A 0.x
# version is marked as a pre-release. A PR that changes this file or the shared
# release workflow builds the same jars without releasing anything, so the
# workflow is tried before a tag needs it.
#
# Assets: the mod jar, which nests the API, and the API jar with its sources
# and javadoc jars for mod developers. Players never install either: ZAS³,
# Expedition and NT Engineering nest them. apiCompat downloads the API jar from
# here as its baseline, checked against SHA256SUMS.txt. The test kit and the
# Gradle plugins are on Maven Central only.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/shared-release.yml"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    uses: ./.github/workflows/shared-release.yml
    with:
      title: SS13 Framework
      build: ":ss13-framework:jar :ss13-framework-api:jar :ss13-framework-api:sourcesJar :ss13-framework-api:plainJavadocJar"
      assets: |
        ss13-framework/build/libs/ss13_framework-{mod_version}.jar
        ss13-framework-api/build/libs/ss13-framework-api-{api_version}.jar
        ss13-framework-api/build/libs/ss13-framework-api-{api_version}-sources.jar
        ss13-framework-api/build/libs/ss13-framework-api-{api_version}-javadoc.jar
      notes: |
        For Minecraft 1.21.1 on NeoForge. Players don't install these: ZAS³, Expedition and NT Engineering nest them.

        - **`ss13_framework-{mod_version}.jar`**: the SS13 Framework mod, with API {api_version} nested.
        - **`ss13-framework-api-*.jar`**: the API, with its sources and javadoc, for mod developers. Also on Maven Central as `io.github.west3436:ss13-framework-api:{api_version}`.
