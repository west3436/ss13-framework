name: Build and test (shared)

# The main CI of a mod that builds with the framework's Gradle plugins: ZAS³,
# Expedition, NT Engineering and the framework itself. A mod's ci.yml calls it:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
#   permissions:
#     contents: read
#   concurrency:
#     group: ci-${{ github.ref }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: west3436/ss13-framework/.github/workflows/shared-build.yml@v0.2.0
#       with:
#         gametests: |
#           1 runGameTestServer
#         snapshot: ":expedition-api:publishToMavenCentral -PapiSnapshot=true"
#       secrets: inherit
#
# Jobs:
#
# - Build and test: ./gradlew build, whose check runs the asset credits
#   (io.github.west3436.ss13.credits), formatting and an API's checks
#   (io.github.west3436.ss13.api), then each GameTest run in `gametests`.
# - Publish snapshots: after a green build of a push to main, when `snapshot`
#   names what to publish. Never on PRs: they don't get the secrets. Without
#   CENTRAL_USERNAME and CENTRAL_PASSWORD it is skipped with a notice.
# - Docs links: relative links and anchors in every Markdown file.

on:
  workflow_call:
    inputs:
      java-version:
        description: The Java that runs Gradle.
        type: string
        default: "21"
      build:
        description: The Gradle arguments of the build step.
        type: string
        default: build
      after-build:
        description: >-
          Bash run after the build and before the GameTests, in the same job,
          such as a coverage report or a benchmark check. Empty for none.
        type: string
        default: ""
      gametests:
        description: >-
          The GameTest runs, one per line: the number of GameTest servers that
          must report that their tests passed, then the Gradle arguments, as in
          "2 runGameTestServer -x :example-addon:runGameTestServer". Lines
          starting with # are left out. Empty for none.
        type: string
        default: ""
      gametest-timeout-minutes:
        description: The time all the GameTest runs together may take.
        type: number
        default: 20
      artifact-name:
        description: A name to upload `artifact-path` under. Empty for none.
        type: string
        default: ""
      artifact-path:
        description: The files to upload, as actions/upload-artifact's path.
        type: string
        default: ""
      snapshot:
        description: >-
          The Gradle arguments that publish snapshots after a green build of a
          push to main, such as "publishToMavenCentral -Psnapshot=true". Empty
          for none.
        type: string
        default: ""
      docs-links:
        description: Whether to check the relative links and anchors in the Markdown files.
        type: boolean
        default: true
    secrets:
      CENTRAL_USERNAME:
        required: false
      CENTRAL_PASSWORD:
        required: false
      SIGNING_KEY:
        required: false
      SIGNING_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Build
        shell: bash
        env:
          ARGS: ${{ inputs.build }}
        run: ./gradlew $ARGS --stacktrace
      - name: After the build
        if: inputs.after-build != ''
        shell: bash
        run: ${{ inputs.after-build }}
      # A GameTest task can succeed without a server ever starting, so the log
      # must also say that the tests passed, once for each server.
      - name: GameTests (dedicated server)
        if: inputs.gametests != ''
        timeout-minutes: ${{ inputs.gametest-timeout-minutes }}
        shell: bash
        env:
          RUNS: ${{ inputs.gametests }}
        run: |
          n=0
          while IFS= read -r line; do
            line="${line#"${line%%[![:space:]]*}"}"
            case "$line" in ""|"#"*) continue ;; esac
            servers="${line%% *}"
            args="${line#* }"
            if ! [[ "$servers" =~ ^[0-9]+$ ]] || [ "$args" = "$line" ]; then
              echo "::error::A gametests line is the number of servers and then the Gradle arguments, not '$line'."
              exit 1
            fi
            n=$((n + 1))
            log="gametests-$n.log"
            echo "::group::./gradlew $args"
            ./gradlew $args --stacktrace | tee "$log"
            echo "::endgroup::"
            passed=$(grep -cE "All [0-9]+ required tests passed" "$log" || true)
            if [ "$passed" -ne "$servers" ]; then
              echo "::error::./gradlew $args: expected $servers GameTest server(s) to report that their tests passed, but $passed did."
              exit 1
            fi
            echo "./gradlew $args: $passed GameTest server(s) passed."
          done <<< "$RUNS"
      - uses: actions/upload-artifact@v7
        if: inputs.artifact-name != ''
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}

  publish-snapshot:
    name: Publish snapshots
    needs: build
    if: inputs.snapshot != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
      # Optional: Central doesn't require signed snapshots. The build signs
      # when a key is set.
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - name: Check for Central credentials
        id: creds
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_mavenCentralPassword" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CENTRAL_USERNAME or CENTRAL_PASSWORD is not set; skipping the snapshots."
          fi
      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
      - uses: actions/setup-java@v6
        if: steps.creds.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v6
        if: steps.creds.outputs.present == 'true'
      - name: Publish the snapshots
        if: steps.creds.outputs.present == 'true'
        shell: bash
        env:
          ARGS: ${{ inputs.snapshot }}
        run: ./gradlew $ARGS --stacktrace

  docs:
    name: Docs links
    if: inputs.docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check relative links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments --no-progress './**/*.md'
          fail: true
