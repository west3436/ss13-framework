org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The same toolchain as ZAS³, so the three mods that nest the framework build and test on one
# NeoForge. neo_version is what we build and test against, and the mod's minimum: one number, so
# CI always tests the floor. Raising it raises the floor for every mod that nests the framework.
minecraft_version=1.21.1
neo_version=21.1.264
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# The mod stays 0.x until ZAS³, Expedition and NT Engineering all use it. The API has its own
# semver: while it is 0.x a new minor version may break it, and from 1.0 only a new major may.
mod_version=0.3.1
api_version=0.3.1

# The last released API version, the baseline for the binary-compatibility check (apiCompat). The
# check downloads ss13-framework-api-<api_baseline_version>.jar from the GitHub release
# api_baseline_tag and refuses a jar whose SHA-256 isn't api_baseline_sha256, which is the jar's
# line in that release's SHA256SUMS.txt. After a release, set all three. With the version empty
# the check is skipped, as it is until the first release.
api_baseline_version=0.3.1
api_baseline_tag=v0.3.1
api_baseline_sha256=e379a7b41afc6f02e4f03e76987b7334ed1bd95642c45c43da8118dd4ca50e73
